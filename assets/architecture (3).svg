<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1520" height="800" viewBox="0 0 1520 800" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Docker Container Health Monitor</title>
  <desc id="svgDesc">Animated architecture diagram showing Docker containers, Docker daemon, Docker Python SDK, health monitor, alert manager, rotating logs, FastAPI endpoints, and an external API client.</desc>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dce3ed"/></pattern>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#23324d" flood-opacity=".09"/></filter>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#263449}
      .heading{font-size:34px;font-weight:700;letter-spacing:-.7px}
      .tagline{font-size:14px;fill:#718096}
      .card{fill:#fff;stroke:#dce4ee;stroke-width:1.4}
      .card-title{font-size:15px;font-weight:700;text-anchor:middle}
      .mono{font-family:"Courier New",monospace}
      .docker-line{fill:none;stroke:#3787df;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .monitor-line{fill:none;stroke:#8960d5;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .api-line{fill:none;stroke:#20a477;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .alert-line{fill:none;stroke:#e99a35;stroke-width:2;stroke-linecap:round}
      .dot{r:4}
      .hex{fill:#eff6ff;stroke:#3787df;stroke-width:2;stroke-linejoin:round}
      .endpoint{font-family:"Courier New",monospace;font-size:11px;fill:#34445b}
    </style>
    <path id="p-container-1" d="M220 270 C246 270 242 395 270 395"/>
    <path id="p-container-2" d="M220 410 C244 410 246 425 270 425"/>
    <path id="p-container-3" d="M220 550 C246 550 242 455 270 455"/>
    <path id="p-daemon-sdk" d="M480 425 H560"/>
    <path id="p-sdk-monitor" d="M630 360 V270 Q630 250 650 250 H760"/>
    <path id="p-monitor-alert" d="M930 250 H990"/>
    <path id="p-alert-logs" d="M1100 360 V450"/>
    <path id="p-sdk-api" d="M630 490 V640 H700"/>
    <path id="p-client-request" d="M1340 620 H1000"/>
    <path id="p-api-response" d="M1000 680 H1340"/>
    <g id="terminal">
      <rect x="-25" y="-17" width="50" height="34" rx="6" fill="#17253a"/>
      <path d="M-15 -5 L-8 1 L-15 7 M-4 7 H8" fill="none" stroke="#75e0b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="17" cy="-9" r="2" fill="#ffb45d"/>
    </g>
    <g id="container-hex">
      <path class="hex" d="M0 -50 L43.3 -25 L43.3 25 L0 50 L-43.3 25 L-43.3 -25 Z"/>
      <path d="M-18 -12 L0 -22 L18 -12 L18 10 L0 21 L-18 10 Z" fill="#d5e8ff" stroke="#3787df" stroke-width="1.5"/>
      <path d="M-18 -12 L0 -1 L18 -12 M0 -1 V21" fill="none" stroke="#3787df" stroke-width="1.5"/>
      <path d="M-9 -17 L9 -7 M-9 4 L9 14" stroke="#3787df" stroke-width="1.2" fill="none"/>
    </g>
  </defs>
  <rect width="1520" height="800" fill="#fff"/>
  <rect width="1520" height="800" fill="url(#dots)"/>
  <text class="heading" x="50" y="60">Docker Container Health Monitor</text>
  <text class="tagline" x="1470" y="60" text-anchor="end">monitor - alert - log</text>

  <rect x="530" y="100" width="760" height="650" rx="20" fill="#fbfcff" fill-opacity=".45" stroke="#aab6c8" stroke-width="1.8" stroke-dasharray="8 7"/>
  <rect x="548" y="119" width="232" height="30" rx="8" fill="#fff"/>
  <text x="560" y="140" font-size="13" font-weight="700" fill="#64748b">health-monitor container</text>

  <g id="flow-lines">
    <use xlink:href="#p-container-1" class="docker-line"/>
    <use xlink:href="#p-container-2" class="docker-line"/>
    <use xlink:href="#p-container-3" class="docker-line"/>
    <use xlink:href="#p-daemon-sdk" class="docker-line"/>
    <use xlink:href="#p-sdk-monitor" class="monitor-line"/>
    <use xlink:href="#p-monitor-alert" class="monitor-line"/>
    <use xlink:href="#p-alert-logs" class="alert-line"/>
    <use xlink:href="#p-sdk-api" class="api-line"/>
    <use xlink:href="#p-client-request" class="api-line"/>
    <use xlink:href="#p-api-response" class="api-line"/>
  </g>

  <g fill="#3787df">
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="0s"><mpath xlink:href="#p-container-1"/></animateMotion></circle>
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="-1s"><mpath xlink:href="#p-container-1"/></animateMotion></circle>
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="-2s"><mpath xlink:href="#p-container-1"/></animateMotion></circle>
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="0s"><mpath xlink:href="#p-container-2"/></animateMotion></circle>
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="-1s"><mpath xlink:href="#p-container-2"/></animateMotion></circle>
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="-2s"><mpath xlink:href="#p-container-2"/></animateMotion></circle>
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="0s"><mpath xlink:href="#p-container-3"/></animateMotion></circle>
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="-1s"><mpath xlink:href="#p-container-3"/></animateMotion></circle>
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="-2s"><mpath xlink:href="#p-container-3"/></animateMotion></circle>
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="0s"><mpath xlink:href="#p-daemon-sdk"/></animateMotion></circle>
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="-1s"><mpath xlink:href="#p-daemon-sdk"/></animateMotion></circle>
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="-2s"><mpath xlink:href="#p-daemon-sdk"/></animateMotion></circle>
  </g>

  <g fill="#8960d5">
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="0s"><mpath xlink:href="#p-sdk-monitor"/></animateMotion></circle>
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="-0.75s"><mpath xlink:href="#p-sdk-monitor"/></animateMotion></circle>
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="-1.5s"><mpath xlink:href="#p-sdk-monitor"/></animateMotion></circle>
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="-2.25s"><mpath xlink:href="#p-sdk-monitor"/></animateMotion></circle>
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="0s"><mpath xlink:href="#p-monitor-alert"/></animateMotion></circle>
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="-0.75s"><mpath xlink:href="#p-monitor-alert"/></animateMotion></circle>
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="-1.5s"><mpath xlink:href="#p-monitor-alert"/></animateMotion></circle>
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="-2.25s"><mpath xlink:href="#p-monitor-alert"/></animateMotion></circle>
  </g>

  <g fill="#e99a35">
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="0s"><mpath xlink:href="#p-alert-logs"/></animateMotion></circle>
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="-1s"><mpath xlink:href="#p-alert-logs"/></animateMotion></circle>
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="-2s"><mpath xlink:href="#p-alert-logs"/></animateMotion></circle>
  </g>

  <g fill="#20a477">
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="0s"><mpath xlink:href="#p-sdk-api"/></animateMotion></circle>
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="-1s"><mpath xlink:href="#p-sdk-api"/></animateMotion></circle>
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="-2s"><mpath xlink:href="#p-sdk-api"/></animateMotion></circle>
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="0s"><mpath xlink:href="#p-client-request"/></animateMotion></circle>
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="-0.75s"><mpath xlink:href="#p-client-request"/></animateMotion></circle>
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="-1.5s"><mpath xlink:href="#p-client-request"/></animateMotion></circle>
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="-2.25s"><mpath xlink:href="#p-client-request"/></animateMotion></circle>
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="0s"><mpath xlink:href="#p-api-response"/></animateMotion></circle>
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="-0.75s"><mpath xlink:href="#p-api-response"/></animateMotion></circle>
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="-1.5s"><mpath xlink:href="#p-api-response"/></animateMotion></circle>
    <circle class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="-2.25s"><mpath xlink:href="#p-api-response"/></animateMotion></circle>
  </g>

  <text x="1160" y="609" font-size="11" fill="#16855f" text-anchor="middle">request</text>
  <text x="1165" y="669" font-size="11" fill="#16855f" text-anchor="middle">JSON response</text>

  <g id="docker-containers">
    <rect class="card" filter="url(#shadow)" x="30" y="130" width="190" height="560" rx="14"/>
    <text class="card-title" x="125" y="165">Docker Containers</text>
    <use xlink:href="#container-hex" x="125" y="270"/>
    <text x="125" y="345" text-anchor="middle" font-size="12">container</text>
    <use xlink:href="#container-hex" x="125" y="410"/>
    <text x="125" y="485" text-anchor="middle" font-size="12">container</text>
    <use xlink:href="#container-hex" x="125" y="550"/>
    <text x="125" y="625" text-anchor="middle" font-size="12">container</text>
  </g>

  <g id="docker-daemon">
    <rect class="card" filter="url(#shadow)" x="270" y="360" width="210" height="130" rx="14"/>
    <rect x="347" y="378" width="56" height="27" rx="6" fill="#e7f2ff"/>
    <path d="M359 386 H391 M359 392 H391 M359 398 H380" stroke="#3787df" stroke-width="2" stroke-linecap="round"/>
    <text x="375" y="432" class="card-title">Docker daemon</text>
    <text x="375" y="454" class="mono" font-size="11" text-anchor="middle" fill="#64748b">/var/run/docker.sock</text>
  </g>

  <g id="docker-sdk">
    <rect class="card" filter="url(#shadow)" x="560" y="360" width="140" height="130" rx="14"/>
    <rect x="612" y="380" width="36" height="28" rx="5" fill="#f0eaff"/>
    <path d="M619 387 H641 M619 393 H641 M619 399 H635" stroke="#8960d5" stroke-width="2" stroke-linecap="round"/>
    <text class="card-title" x="630" y="435">Docker SDK</text>
    <text x="630" y="456" text-anchor="middle" class="mono" font-size="12" fill="#64748b">Python</text>
  </g>

  <g id="monitor">
    <rect class="card" filter="url(#shadow)" x="760" y="190" width="170" height="120" rx="14"/>
    <circle cx="845" cy="215" r="12" fill="#eee7ff"/>
    <path d="M838 215 L843 220 L852 210" stroke="#8960d5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="card-title" x="845" y="249">Monitor</text>
    <text class="mono" x="845" y="269" text-anchor="middle" font-size="11" fill="#64748b">app/monitor.py</text>
    <text x="845" y="289" text-anchor="middle" font-size="12" fill="#8960d5">every 10s</text>
  </g>

  <g id="alert-manager">
    <rect class="card" filter="url(#shadow)" x="990" y="170" width="220" height="190" rx="14"/>
    <text class="card-title" x="1100" y="198">Alert Manager</text>
    <text class="mono" x="1100" y="219" text-anchor="middle" font-size="11" fill="#64748b">app/alerts.py</text>
    <path d="M1012 231 H1188" stroke="#edf0f5" stroke-width="1"/>
    <g class="mono" font-size="11" fill="#59677b">
      <text x="1012" y="249">- CPU &gt; 80%</text>
      <text x="1012" y="267">- memory &gt; 80%</text>
      <text x="1012" y="285">- container stopped</text>
      <text x="1012" y="303">- recovery</text>
      <text x="1012" y="321">- duplicate prevention</text>
    </g>
  </g>

  <g id="duplicate-suppressed">
    <circle cx="1100" cy="405" r="11" fill="#fff" stroke="#dc4545" stroke-width="2"/>
    <path d="M1096 401 L1104 409 M1104 401 L1096 409" stroke="#dc4545" stroke-width="2" stroke-linecap="round"/>
    <text x="1120" y="409" class="mono" font-size="11" fill="#c93b3b">duplicate alert suppressed</text>
  </g>

  <g id="logs">
    <rect class="card" filter="url(#shadow)" x="990" y="450" width="220" height="90" rx="14"/>
    <path d="M1011 468 H1027 L1034 475 V494 H1011 Z" fill="#fff3e4" stroke="#e99a35" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M1027 468 V475 H1034 M1016 481 H1029 M1016 486 H1029" stroke="#e99a35" stroke-width="1.3" fill="none"/>
    <text x="1100" y="482" text-anchor="middle" font-size="12" font-weight="700">logs/monitor.log</text>
    <text x="1100" y="505" text-anchor="middle" class="mono" font-size="11" fill="#64748b">rotating - 1 MB - 3 backups</text>
  </g>

  <g id="status-pills">
    <rect x="1030" y="560" width="105" height="30" rx="15" fill="#fff0dc" stroke="#f2c27c"/>
    <circle cx="1045" cy="575" r="4" fill="#e99a35"/>
    <text x="1084" y="579" text-anchor="middle" font-size="11" font-weight="700" fill="#a55c0b">WARNING</text>
    <rect x="1145" y="560" width="135" height="30" rx="15" fill="#e2f7ed" stroke="#9eddbf"/>
    <circle cx="1160" cy="575" r="4" fill="#20a477"/>
    <text x="1213" y="579" text-anchor="middle" font-size="11" font-weight="700" fill="#14734f">INFO - recovered</text>
  </g>

  <g id="fastapi">
    <rect class="card" filter="url(#shadow)" x="700" y="560" width="300" height="160" rx="14"/>
    <rect x="722" y="576" width="6" height="22" rx="3" fill="#20a477"/>
    <text x="850" y="592" text-anchor="middle" font-size="20" font-weight="700">FastAPI</text>
    <text x="850" y="612" text-anchor="middle" class="mono" font-size="12" fill="#64748b">app/main.py - :8000</text>
    <path d="M720 623 H980" stroke="#edf0f5" stroke-width="1"/>
    <g class="endpoint">
      <text x="725" y="643">GET /</text>
      <text x="725" y="661">GET /containers</text>
      <text x="725" y="679">GET /containers/{name}/stats</text>
    </g>
  </g>

  <g id="api-client">
    <rect class="card" filter="url(#shadow)" x="1340" y="560" width="150" height="160" rx="14"/>
    <use xlink:href="#terminal" x="1415" y="600"/>
    <text x="1415" y="643" text-anchor="middle" font-size="15" font-weight="700">API Client</text>
    <text x="1415" y="665" text-anchor="middle" class="mono" font-size="11" fill="#64748b">curl / Swagger UI</text>
  </g>

  <g id="legend">
    <rect class="card" x="30" y="730" width="1230" height="45" rx="12"/>
    <circle cx="62" cy="752" r="5" fill="#8960d5"/>
    <text x="76" y="756" font-size="12">monitoring traffic</text>
    <circle cx="320" cy="752" r="5" fill="#20a477"/>
    <text x="334" y="756" font-size="12">API request/response</text>
    <circle cx="600" cy="752" r="5" fill="#e99a35"/>
    <text x="614" y="756" font-size="12">alerts</text>
    <circle cx="790" cy="752" r="5" fill="#dc4545"/>
    <text x="804" y="756" font-size="12">duplicate suppressed</text>
    <circle cx="1005" cy="752" r="5" fill="#3787df"/>
    <text x="1019" y="756" font-size="12">Docker connections</text>
  </g>
</svg>
